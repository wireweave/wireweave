name: CI

# Pull requests and versioned releases use the same verification contract.
# Pushes remain owned by publish.yml: develop -> beta, main -> stable.
on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify a changeset accompanies publishable source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changeset.mjs

  quality:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release contract
        run: pnpm release:verify --report .local/release-evidence/verification.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-evidence/*.json
          include-hidden-files: true
          if-no-files-found: warn
