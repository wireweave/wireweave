name: Publish packages

# develop publishes beta through changesets pre mode; main publishes stable.
# VS Code and docs retain their separate publication/deployment pipelines.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write # npm Trusted Publishing
      pull-requests: write
    env:
      # Checks run explicitly before committing; the version commit cannot
      # invoke formatting hooks that change the already-verified tree.
      HUSKY: '0'
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - name: Update npm for trusted publishing
        # npm 11 supports OIDC and the repository's Node 22.13 floor.
        run: npm install -g npm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare versioned tree
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-registry.mjs policy --branch "$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = develop ]; then
            if [ ! -f .changeset/pre.json ]; then
              pnpm exec changeset pre enter beta
            fi
          fi
          pnpm exec changeset version
          node scripts/release-registry.mjs policy --branch "$GITHUB_REF_NAME" --versioned
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --name-only --diff-filter=ACM -z -- .changeset 'packages/*/package.json' 'packages/*/CHANGELOG.md' pnpm-lock.yaml |
            xargs -0 --no-run-if-empty pnpm exec prettier --write
          git add -A
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"

      - name: Verify exact versioned tree
        env:
          WIREWEAVE_TESTED_TREE: ${{ steps.version.outputs.tree }}
        run: pnpm release:verify --report .local/release-evidence/verification.json

      - name: Commit verified versions and push without rebasing
        id: committed
        env:
          VERIFIED_TREE: ${{ steps.version.outputs.tree }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = "$VERIFIED_TREE"
          git remote -v
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Release branch advanced during verification. Rerun on its new head."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: version wireweave packages ${GITHUB_REF_NAME} [skip ci]"
          fi
          test "$(git rev-parse 'HEAD^{tree}')" = "$VERIFIED_TREE"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bind publication intent to verified artifacts
        env:
          RELEASE_SHA: ${{ steps.committed.outputs.sha }}
        run: |
          node scripts/release-registry.mjs preflight --verification .local/release-evidence/verification.json --branch "$GITHUB_REF_NAME" --commit "$RELEASE_SHA" --report .local/release-evidence/publication-intent.json

      - name: Preserve immutable intent before publication
        uses: actions/upload-artifact@v7
        with:
          name: publication-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-evidence/publication-intent.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish verified packages
        id: publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          pnpm_config_provenance: 'true'
          npm_config_ignore_scripts: 'true'
          pnpm_config_ignore_scripts: 'true'
          RELEASE_SHA: ${{ steps.committed.outputs.sha }}
          VERIFIED_TREE: ${{ steps.version.outputs.tree }}
        run: |
          node scripts/release-registry.mjs recheck --intent .local/release-evidence/publication-intent.json
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$VERIFIED_TREE"
          test -z "$(git status --porcelain)"
          git remote -v
          remote_sha=$(git ls-remote --exit-code origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$remote_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release branch advanced before publication. Rerun verification."
            exit 1
          fi
          # Pre mode supplies beta itself; an explicit --tag is invalid there.
          pnpm exec changeset publish

      - name: Verify registry content and release channels
        run: |
          node scripts/release-registry.mjs verify --intent .local/release-evidence/publication-intent.json --report .local/release-evidence/registry-artifacts.json

      - name: Recover exact release tags without rewriting history
        run: |
          node scripts/release-registry.mjs tags --intent .local/release-evidence/publication-intent.json --registry-proof .local/release-evidence/registry-artifacts.json --report .local/release-evidence/release-tags.json

      - name: Verify published MCP exact version
        run: |
          node scripts/release-registry.mjs smoke --intent .local/release-evidence/publication-intent.json --registry-proof .local/release-evidence/registry-artifacts.json --report .local/release-evidence/registry-mcp.json

      - name: Sync released main into develop
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ steps.committed.outputs.sha }}
        run: |
          git remote -v
          git fetch origin develop
          git checkout --detach origin/develop
          if ! git merge --no-ff "$RELEASE_SHA" -m "chore: sync main into develop after stable release [skip ci]"; then
            echo "::error::Sync conflict requires manual resolution; no files or versions were selected automatically."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin HEAD:refs/heads/develop

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-evidence/*.json
          include-hidden-files: true
          if-no-files-found: warn
